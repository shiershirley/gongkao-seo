<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公考备考资料领取中心 - 公考资讯站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header p { font-size: 18px; opacity: 0.9; }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .item-card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .item-card h3 {
            font-size: 20px;
            color: #1890ff;
            margin-bottom: 8px;
        }
        .item-card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: #1890ff;
            color: white;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.8;
        }
        .footer a { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>公考备考资料领取中心</h1>
            <p>扫码成功！请选择您需要的备考资料</p>
        </div>
        <div class="card-grid">
            
        <a href="/guokao/" class="item-card">
            <h3>2026国考职位表完整版</h3>
            <p>含报录比、进面分数线</p>
            <span class="btn">立即查看 &rarr;</span>
        </a>
        
        <a href="/guokao/" class="item-card">
            <h3>申论高分范文100篇</h3>
            <p>历年高分范文精选</p>
            <span class="btn">立即查看 &rarr;</span>
        </a>
        
        <a href="/beikao-zhinan/" class="item-card">
            <h3>行测速算技巧手册</h3>
            <p>资料分析速算公式</p>
            <span class="btn">立即查看 &rarr;</span>
        </a>
        
        <a href="/beikao-zhinan/" class="item-card">
            <h3>面试真题解析合集</h3>
            <p>结构化面试真题+解析</p>
            <span class="btn">立即查看 &rarr;</span>
        </a>
        
        <a href="/beikao-zhinan/" class="item-card">
            <h3>公考备考时间规划表</h3>
            <p>3个月/6个月备考计划</p>
            <span class="btn">立即查看 &rarr;</span>
        </a>
        
        </div>
        <div class="footer">
            <p>更多公考资讯，请访问 <a href="/">公考资讯站</a></p>
            <p style="margin-top:10px; font-size:12px;">提示：关注公众号"上海公考资讯站"，回复"资料"获取更多备考资源</p>
        </div>
    </div>
</body>
</html>
