            - generic [ref=e33]: 10 min read
          - heading "国考行测常识判断高频考点梳理与备考策略" [level=1] [ref=e34]
          - paragraph [ref=e35]: 国考行测常识判断题量大、范围广，涵盖政治、法律、科技、人文、地理等多个领域。本文系统梳理近年国考常识判断的高频考点和命题趋势，帮助考生抓住重点、有的放矢地进行针对性备考，提升常识模块的得分效率。
          - generic [ref=e36]:
            - generic [ref=e37]: "#国考"
            - generic [ref=e38]: "#行测"
            - generic [ref=e39]: "#常识判断"
            - generic [ref=e40]: "#高频考点"
        - generic [ref=e41]:
          - heading "国考行测常识判断高频考点梳理与备考策略" [level=1] [ref=e42]
          - paragraph [ref=e43]: 常识判断是国考行测中覆盖范围最广、备考难度最大的模块之一。20道题涉及政治、经济、法律、历史、文化、地理、科技、生活常识等多学科知识，很多考生感觉「无从下手」。但通过分析近年真题，可以发现常识判断的命题是有规律可循的。本文将系统梳理高频考点和备考策略，帮助考生高效攻克这一模块。
          - paragraph [ref=e44]:
            - img "政府政务" [ref=e45]
          - heading "一、常识判断的命题特点" [level=2] [ref=e46]
          - heading "1. 政治类试题占比最高" [level=3] [ref=e47]
          - paragraph [ref=e48]: 近年来，政治类（含时政）题目在常识判断中占比持续走高，通常达到30%-40%。这一趋势在2025年和2026年的考试中表现得尤为明显。
          - paragraph [ref=e49]: 政治类题目的考查重点包括：重大会议和重要文件精神的理解、国家重大战略部署（如「双碳」目标、乡村振兴、共同富裕等）、外交政策和国际关系中的重大事件。
          - heading "2. 法律类试题稳定出现" [level=3] [ref=e50]
          - paragraph [ref=e51]: 法律类题目通常占4-6题，重点考查新颁布或新修订的法律法规。近两年需要重点关注的法律包括：《民法典》的司法解释及适用案例、《行政处罚法》修订后的新规定、《个人信息保护法》的核心条款、《未成年人保护法》修订要点。
          - heading "3. 科技类试题「新旧结合」" [level=3] [ref=e52]
          - paragraph [ref=e53]: 科技类题目既考查最新科技成就（如航空航天、深海探测、量子计算等前沿领域的重大突破），也考查基础科学常识（物理、化学、生物的基本原理）。2025-2026年尤其需要关注我国在航天工程（载人登月、空间站建设）、新能源汽车、人工智能等领域的重大进展。
          - heading "4. 文史类试题注重「常识中的常识」" [level=3] [ref=e54]
          - paragraph [ref=e55]: 历史人文类题目很少考偏门冷知识，而是集中在具有重大历史意义的事件和人物上。常见的出题方向包括：中国古代重要制度（科举制、郡县制、三省六部制等）、近现代重大历史事件的时间线、中国古代科技成就（四大发明及天文历法医学等）。
          - heading "二、高频考点分类梳理" [level=2] [ref=e56]
          - heading "政治模块高频考点" [level=3] [ref=e57]
          - paragraph [ref=e58]:
            - strong [ref=e59]: 习近平新时代中国特色社会主义思想的核心内容
            - text: ：「十个明确」「十四个坚持」「十三个方面成就」的整体框架需要熟悉。
          - paragraph [ref=e60]:
            - strong [ref=e61]: 党的二十大及历次中央全会精神
            - text: ：尤其是关于中国式现代化、高质量发展、国家安全等重大论断。
          - paragraph [ref=e62]:
            - strong [ref=e63]: 年度重大时政
            - text: ：包括重要主场外交活动、重大政策发布、重要纪念日等。建议关注2025年下半年至2026年上半年间的时政大事。
          - paragraph [ref=e64]:
            - strong [ref=e65]: 中央经济工作会议和中央农村工作会议
            - text: ：每年底召开，对来年经济工作和农村工作部署具有方向性意义。
          - heading "法律模块高频考点" [level=3] [ref=e66]
          - paragraph [ref=e67]:
            - strong [ref=e68]: 宪法
            - text: ：公民的基本权利和义务、国家机构的设置及其职权。
          - paragraph [ref=e69]:
            - strong [ref=e70]: 民法典
            - text: ：合同编、侵权责任编中的常见法律关系和责任认定。
          - paragraph [ref=e71]:
            - strong [ref=e72]: 行政法
            - text: ：行政处罚的种类和程序、行政许可、行政强制、行政复议、国家赔偿。
          - paragraph [ref=e73]:
            - strong [ref=e74]: 新法新规
            - text: ：《反电信网络诈骗法》《妇女权益保障法》（修订）、《农产品质量安全法》（修订）等近年新出台或修订的法律。
          - heading "科技模块高频考点" [level=3] [ref=e75]
          - paragraph [ref=e76]:
            - strong [ref=e77]: 航天科技
            - text: ：载人航天工程进展（神舟系列、天宫空间站）、探月工程（嫦娥系列）、火星探测（天问系列）、北斗导航系统应用。
          - paragraph [ref=e78]:
            - strong [ref=e79]: 信息技术
            - text: ：5G/6G通信技术、人工智能发展、量子计算突破、芯片技术自主创新。
          - paragraph [ref=e80]:
            - strong [ref=e81]: 生物医药
            - text: ：重大疾病防治成果、疫苗研发、基因编辑技术等。
          - paragraph [ref=e82]:
            - strong [ref=e83]: 基础科学
            - text: ：物理学基本定律（牛顿定律、能量守恒等）、化学元素周期表基本知识、生物学基础知识（细胞结构、光合作用等）。
          - heading "文史模块高频考点" [level=3] [ref=e84]
          - paragraph [ref=e85]:
            - strong [ref=e86]: 中国古代史
            - text: ：重要朝代的顺序和都城、重大制度改革（商鞅变法、科举制等）、丝绸之路与中外文化交流。
          - paragraph [ref=e87]:
            - strong [ref=e88]: 中国近现代史
            - text: ：鸦片战争以来的重大历史事件时间线、中国共产党的重大历史节点。
          - paragraph [ref=e89]:
            - strong [ref=e90]: 文学常识
            - text: ：古代文学经典作品（四大名著、唐诗宋词代表人物及代表作）、近现代重要作家及其作品。
          - paragraph [ref=e91]:
            - strong [ref=e92]: 地理常识
            - text: ：中国主要山脉、河流、湖泊的分布、中国行政区划基本知识、世界主要国家和地区的地理特征。
          - paragraph [ref=e93]:
            - img "职场工作" [ref=e94]
          - heading "三、高效备考策略" [level=2] [ref=e95]
          - heading "策略一：以真题为导向，抓大放小" [level=3] [ref=e96]
          - paragraph [ref=e97]: 常识判断范围太广，不可能全部覆盖。最有效的策略是以真题为导向：把近5年的国考常识真题全部做一遍，归纳出反复出现的知识点。这些高频考点占实际考试题目的比重很高，投入产出比最大。
          - heading "策略二：分模块制定学习计划" [level=3] [ref=e98]
          - paragraph [ref=e99]: 建议按以下时间和精力分配：
          - paragraph [ref=e100]: 政治/时政：占总备考时间的35%，因为这是分值最高且最有投入产出比的模块。法律：占25%，重点攻克宪法、民法典和行政法。科技：占20%，重点关注航空航天和新科技成就。文史/地理/生活常识：占20%，这部分靠日常积累，不需要花整块时间专门背诵。
          - heading "策略三：「学习强国」是备考利器" [level=3] [ref=e101]
          - paragraph [ref=e102]: 「学习强国」APP的「要闻」「新思想」「科技」「法治中国」等频道，涵盖了常识判断中绝大部分的时政和科技考点。每天利用通勤、午休等碎片时间浏览15-20分钟，日积月累效果显著。
          - heading "策略四：善用排除法和推理法" [level=3] [ref=e103]
          - paragraph [ref=e104]: 常识判断的解题技巧同样重要。当遇到完全没见过的知识点时，可以运用以下方法提高正确率：排除法——剔除明显错误的选项，提高猜对概率。常识推理——结合已有知识进行逻辑推断。选项分析——注意选项中的绝对化表述（如「所有」「唯一」「完全」等），这类表述往往是错误的。
          - heading "四、考前冲刺建议" [level=2] [ref=e105]
          - paragraph [ref=e106]: 考前一个月是常识判断备考的「黄金期」。这个阶段不建议再扩展新知识，而是集中精力做好三件事：
          - paragraph [ref=e107]: 第一，回顾错题和笔记。把之前做过的真题中的错题再过一遍，巩固薄弱知识点。第二，时政「临阵磨枪」。考前两周集中浏览近半年的重大时政新闻，这些内容记忆新鲜，考试时提取效率最高。第三，调整心态。常识判断永远有你不会的题，不要因为一两道题不会而影响整场考试的心态。
          - paragraph [ref=e108]: 常识判断的备考是一场持久战，但也是一场有方法可循的战斗。找准方向、用对方法，完全可以把这一模块从「失分重灾区」变成「稳分基本盘」。
